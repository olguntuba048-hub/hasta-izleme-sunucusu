<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasta İzleme</title>
<style>
body{margin:0;background:#f3f5f9;color:#18263b;font:15px Arial}header{background:#18365b;color:white;padding:25px max(20px,calc((100% - 1050px)/2))}main{max-width:1050px;margin:25px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #e2e7ef;border-radius:12px;padding:17px}.muted{color:#68778c;font-size:13px}.big{font-size:25px;font-weight:bold;margin-top:8px}button{background:#244e7d;color:white;border:0;padding:10px 15px;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid #edf0f4;font-size:13px}.bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}@media(max-width:650px){.cards{grid-template-columns:1fr}.bar{align-items:start;gap:10px;flex-direction:column}}
</style><header><h2>Hasta İzleme Sistemi</h2><div>Bulut sunucusu · Olay takip paneli</div></header><main>
<div class="cards"><div class="card"><div class="muted">Toplam kayıt</div><div class="big" id="total">—</div></div><div class="card"><div class="muted">Son olay</div><div class="big" id="last">—</div></div><div class="card"><div class="muted">Bağlantı</div><div class="big" id="status">Kontrol ediliyor</div></div></div>
<div class="bar"><div><h3>Olay kayıtları</h3><span class="muted">Yeni sinyaller anlık görüntülenir.</span></div><button onclick="load()">Yenile</button></div>
<div class="card" style="overflow:auto"><table><thead><tr><th>No</th><th>Oda</th><th>Olay</th><th>Risk</th><th>Açıklama</th><th>Alınma zamanı</th></tr></thead><tbody id="rows"><tr><td colspan="6">Yükleniyor…</td></tr></tbody></table></div><p class="muted">Prototip amaçlıdır; tıbbi teşhis veya acil müdahale sistemi değildir.</p></main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){try{let r=await fetch("/api/events");if(!r.ok)throw 0;let a=await r.json();$("total").textContent=a.length;$("last").textContent=a.length?"#"+a[0].id:"Yok";$("rows").innerHTML=a.length?a.map(e=>`<tr><td>${e.id}</td><td>${esc(e.room_id)}</td><td>${esc(e.event_type)}</td><td>${esc(e.risk_level)}</td><td>${esc(e.message)}</td><td>${esc((e.received_at||"").replace("T"," ").slice(0,19))}</td></tr>`).join(""):'<tr><td colspan="6">Henüz kayıt yok.</td></tr>'}catch(e){$("rows").innerHTML='<tr><td colspan="6">Sunucuya ulaşılamadı.</td></tr>'}}
function ws(){let w=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");w.onopen=()=>$("status").textContent="Canlı";w.onclose=()=>{ $("status").textContent="Tekrar bağlanıyor";setTimeout(ws,3000)};w.onmessage=load}
load();ws();
</script></html>
